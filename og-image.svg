    <rect x="804" y="295" width="22" height="105" rx="4" fill="#ff00ee" opacity="0.6"/>
    <rect x="836" y="310" width="22" height="90" rx="4" fill="#ff00cc" opacity="0.55"/>
  </g>
  <!-- Title text -->
  <text x="600" y="520" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#00ffcc" filter="url(#textGlow)">AudioWave.app</text>
  <text x="600" y="570" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#a0a0a8">Free Audio Visualizer &amp; Radio</text>
